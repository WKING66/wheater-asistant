name: 每日穿搭推送

on:
  schedule:
    # 注意：GitHub 的 cron 用 UTC 时间。
    # 北京时间 07:00 = UTC 前一天 23:00，所以这里写 0 23 * * *
    - cron: '0 23 * * *'
  workflow_dispatch: {} # 加了这个，网页上会多一个「手动运行」按钮，方便测试

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 生成并发送今日建议
        working-directory: backend
        env:
          # 这些值存在仓库的 Settings → Secrets and variables → Actions 里
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PUSH_CITY: ${{ secrets.PUSH_CITY }}
          PUSH_EMAIL_TO: ${{ secrets.PUSH_EMAIL_TO }}
        run: python push_once.py
