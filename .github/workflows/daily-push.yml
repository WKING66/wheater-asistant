name: 每日穿搭推送

on:
  schedule:
    # GitHub 的 cron 用 UTC：北京时间 07:00 = UTC 前一天 23:00。
    # ⚠️ 但这个触发器现在很不可靠：2026-08 起 GitHub 调度器大面积延迟（本仓库实测晚到 113 分钟），
    #    所以它只当兜底。准点触发交给外部定时器（cron-job.org）打 workflow_dispatch。
    - cron: '0 23 * * *'
  workflow_dispatch: {} # 手动触发入口，也是外部定时器调用的入口

permissions:
  contents: read
  actions: read # 需要读运行历史，用来判断今天是否已经推过

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 两个触发源（外部定时器 + GitHub 自带 cron）都可能在同一天命中，
      # 这里查「北京时间今天」有没有成功记录：有就跳过，避免一天收到两封邮件；
      # 顺带的好处是——早上那次如果失败了，兜底那次会自动重试。
      - name: 今天是否已推送过
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CUTOFF=$(TZ=Asia/Shanghai date -d "today 00:00" +%s)
          N=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily-push.yml \
                --status success --limit 30 --json createdAt \
                --jq "[.[] | select((.createdAt|fromdateiso8601) >= $CUTOFF)] | length" 2>/dev/null || echo 0)
          echo "北京时间今天已有 $N 次成功推送"
          if [ "${N:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        if: steps.check.outputs.skip != 'true'
        run: pip install -r backend/requirements.txt

      - name: 生成并发送今日建议
        if: steps.check.outputs.skip != 'true'
        working-directory: backend
        env:
          # 这些值存在仓库的 Settings → Secrets and variables → Actions 里
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PUSH_CITY: ${{ secrets.PUSH_CITY }}
          PUSH_EMAIL_TO: ${{ secrets.PUSH_EMAIL_TO }}
        run: python push_once.py
